name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck, build & test
    runs-on: ubuntu-latest

    defaults:
      run:
        # The React app lives in a subfolder; run everything from there.
        working-directory: ping-pong-react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ping-pong-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Run tests
        run: npm test

  vision:
    name: Vision pipeline tests
    runs-on: ubuntu-latest

    defaults:
      run:
        # The vision work is a separate Python package; run everything from there.
        working-directory: vision

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: vision/requirements-dev.txt

      # opencv-python links against libGL even for the headless work these
      # tests do — pingpong_vision.ball imports cv2, so `import cv2` has to
      # succeed before a single test collects.
      - name: Install OpenCV's system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No clips: rally.mp4 and the rest are gitignored, and the suite is built
      # not to need them. Every test here is pure logic over synthetic events,
      # tracks and frames — §12's argument for the split. The figures in §5 and
      # §7 come from score_probe.py against footage, by hand, and CI cannot
      # check those.
      - name: Run tests
        run: python -m pytest -q
