<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon-512.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#4A2AA4" />
  <meta name="color-scheme" content="light dark" />
  <script>
    // Paint in the right theme from the first frame: the user's own pick, else
    // whatever the device asks for. Kept in sync with src/lib/theme.ts.
    (function () {
      try {
        var t = localStorage.getItem('rv-theme')
        if (t !== 'light' && t !== 'dark')
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.style.colorScheme = t
      } catch (e) {
        /* storage or matchMedia unavailable: the app applies the theme on boot */
      }
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <title>Ping-Pong · Live</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
